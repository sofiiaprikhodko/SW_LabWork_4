name: JavaScript Code Convention Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Biome
        uses: biomejs/setup-biome@v1
        with:
          version: latest
          
      - name: Run linting on ProgramCode.js
        run: biome check ProgramCode.js
        
      - name: Display success message
        if: success()
        run: echo "ProgramCodeModified.js відповідає нормам кодування"
