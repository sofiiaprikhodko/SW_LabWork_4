name: Program Code Convention Check

on:
  push:
    branches: [main]

jobs:
  lint-both-files:
    name: Lint Both JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Biome
        uses: biomejs/setup-biome@v1
        with:
          version: latest
          
      - name: Auto-format and check ProgramCode.js
        run: |
          echo "=== Автоматичне форматування ProgramCode.js ==="
          biome check --apply ProgramCode.js
          echo "ProgramCode.js - успішно відформатовано та пройшло перевірку"
          
      - name: Check ProgramCodeModified.js (should fail)
        run: |
          echo "=== Перевірка ProgramCodeModified.js (має не пройти) ==="
          if biome check ProgramCodeModified.js; then
            echo "ProgramCodeModified.js - пройшов перевірку (неочікувано)"
            exit 1
          else
            echo "✅ ProgramCodeModified.js - знайдено помилки (очікуваний результат)"
          fi
